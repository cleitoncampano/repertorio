name: Repertorio local em Mac e Windows
on:
  push:
    branches: [main]
    paths: ['app/server/**', 'app/tests/**', 'app/requirements.lock', 'app/setup*', 'app/run*', 'ferramentas/empacotar_produto.py', '.github/workflows/local.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: app/.venv/bin/python
          - os: windows-latest
            python: app/.venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - run: uv venv app/.venv --python 3.12
      - run: uv pip sync --python ${{ matrix.python }} app/requirements.lock
      - run: ${{ matrix.python }} -m pytest app/tests -q
      - name: Preparar instalação pelo PowerShell do Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/web/dist | Out-Null
          Set-Content app/web/dist/index.html '<!doctype html><title>Teste de instalação</title>'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\app\setup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'A instalação Windows falhou.' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\app\run.ps1 demo --home app\.demo-ci
          if ($LASTEXITCODE -ne 0) { throw 'O iniciador Windows falhou.' }
      - name: Preparar instalação pelo shell do Mac
        if: runner.os == 'macOS'
        run: |
          mkdir -p app/web/dist
          printf '<!doctype html><title>Teste de instalação</title>' > app/web/dist/index.html
          ./app/setup.sh
          ./app/run.sh demo --home app/.demo-ci
