[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repertorio"
dynamic = ["version"]
description = "Biblioteca visual local para pessoas e agentes"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2,<3", "alembic>=1.14,<2", "mcp>=1.12,<2", "httpx>=0.27,<1", "pillow>=11", "pypdfium2>=4.30"]

[project.optional-dependencies]
test = ["pytest>=8", "playwright>=1.50"]
# Só para as ferramentas de incorporar coleções (ferramentas/), fora do pacote do produto.
ferramentas = ["pymupdf>=1.25"]

[project.scripts]
repertorio = "repertorio.cli:main"

[tool.setuptools.dynamic]
version = {attr = "repertorio.__version__"}

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]
