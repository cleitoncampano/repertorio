[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repertorio"
version = "0.1.0"
description = "Biblioteca visual local para pessoas e agentes"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2,<3", "alembic>=1.14,<2", "mcp>=1.12,<2", "httpx>=0.27,<1", "pillow>=11", "pymupdf>=1.25"]

[project.optional-dependencies]
test = ["pytest>=8", "playwright>=1.50"]

[project.scripts]
repertorio = "repertorio.cli:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]
